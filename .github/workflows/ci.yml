name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Taskly commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  taskly-quality:
    name: Taskly code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: taskly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskly-backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check

  taskly-test:
    name: Taskly code tests
    runs-on: ubuntu-latest
    needs: [taskly-quality]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: taskly-backend
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taskly-backend/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm run test:integration
      - name: End-to-end tests
        run: npm run test:e2e

  taskly-docker:
    name: Taskly docker container
    runs-on: ubuntu-latest
    needs: [taskly-test]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: taskly-docker
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Prepare environment
        run: make docker/env
      - name: Start stack
        run: make docker/up
      - name: Check health endpoint
        run: curl -fsS http://localhost:8080/
      - name: Check API
        run: |
          curl -fsS -X POST http://localhost:8080/api/v1/auth/signup \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci_user","email":"ci_user@mail.com","password":"CiPassword123"}'
      - name: Check seed
        run: make docker/seed
      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.local.yml ps -a
          docker inspect --format '{{json .State.Health}}' taskly-backend
          echo "=== backend logs"
          docker logs taskly-backend 2>&1 | tail -n 100
          echo "=== postgres logs"
          docker logs taskly-postgres 2>&1 | tail -n 30
      - name: Stop stack
        if: always()
        run: docker compose -f docker-compose.local.yml down -v
